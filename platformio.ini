; PlatformIO Project Configuration for Waveshare ESP32-S3-Touch-LCD-4.3
; Target: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB Octal PSRAM) + ST7262 800x480 RGB Panel + GT911 Touch
; eScooter / eBike VESC Dashboard

[platformio]
default_envs = waveshare-esp32-s3-touch-lcd-43

[env:waveshare-esp32-s3-touch-lcd-43]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; Serial monitor and upload
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyACM0

; Memory & Flash Configuration (16MB Flash QIO, 8MB Octal PSRAM OPI)
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Compiler and Preprocessor Flags
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O3

; Library Dependencies
lib_deps =
    lovyan03/LovyanGFX@^1.1.16

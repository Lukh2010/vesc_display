; PlatformIO Project Configuration for Waveshare ESP32-S3-Touch-LCD-4.3 & 7.0
; Target: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB Octal PSRAM) + ST7262 800x480 RGB Panel + GT911 Touch
; eScooter / eBike VESC Dashboard

[platformio]
default_envs = waveshare-esp32-s3-touch-lcd-43

[common_esp32s3]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps =
    lovyan03/LovyanGFX@^1.1.16

[env:waveshare-esp32-s3-touch-lcd-43]
extends = common_esp32s3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0
    -DWAVESHARE_LCD_4_3=1
    -O3

[env:waveshare-esp32-s3-touch-lcd-7]
extends = common_esp32s3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0
    -DWAVESHARE_LCD_7_0=1
    -O3
